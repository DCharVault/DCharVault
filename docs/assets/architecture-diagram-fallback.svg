<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">DCharVault Architecture Diagram Fallback</title>
  <desc id="desc">Static fallback diagram for MVVM architecture showing View, ViewModel, and Model layers and their interactions.</desc>
  <style>
    .bg { fill: #ffffff; }
    .title { font: 700 30px sans-serif; fill: #111827; }
    .subtitle { font: 500 17px sans-serif; fill: #374151; }
    .layer { fill: #f9fafb; stroke: #9ca3af; stroke-width: 2; rx: 16; }
    .node { fill: #ffffff; stroke: #6b7280; stroke-width: 1.8; rx: 10; }
    .nodeText { font: 600 15px sans-serif; fill: #111827; text-anchor: middle; dominant-baseline: middle; }
    .layerTitle { font: 700 18px sans-serif; fill: #1f2937; }
    .edge { stroke: #4b5563; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .edgeBiA { stroke: #4b5563; stroke-width: 2; fill: none; marker-end: url(#arrow); marker-start: url(#arrow); }
    .edgeDashed { stroke: #4b5563; stroke-width: 2; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrow); }
    .edgeText { font: 500 13px sans-serif; fill: #374151; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563" />
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="650" />
  <text class="title" x="40" y="48">DCharVault Architecture (MVVM)</text>
  <text class="subtitle" x="40" y="78">Static fallback for GitHub Pages when Mermaid does not render</text>

  <rect class="layer" x="50" y="110" width="300" height="470" />
  <text class="layerTitle" x="75" y="142">View Layer (QML UI)</text>

  <rect class="node" x="120" y="220" width="160" height="60" />
  <text class="nodeText" x="200" y="250">Main.qml / Views</text>

  <rect class="layer" x="430" y="110" width="330" height="470" />
  <text class="layerTitle" x="455" y="142">ViewModel Layer (C++ QObject)</text>

  <rect class="node" x="500" y="190" width="190" height="50" /><text class="nodeText" x="595" y="215">LoginViewModel</text>
  <rect class="node" x="500" y="260" width="190" height="50" /><text class="nodeText" x="595" y="285">DiaryViewModel</text>
  <rect class="node" x="500" y="330" width="190" height="50" /><text class="nodeText" x="595" y="355">DiaryListModel</text>
  <rect class="node" x="500" y="400" width="190" height="50" /><text class="nodeText" x="595" y="425">SessionViewModel</text>

  <rect class="layer" x="840" y="110" width="310" height="470" />
  <text class="layerTitle" x="865" y="142">Model Layer (C++ Core Backend)</text>

  <rect class="node" x="900" y="180" width="190" height="48" /><text class="nodeText" x="995" y="204">DiaryManager</text>
  <rect class="node" x="900" y="246" width="190" height="48" /><text class="nodeText" x="995" y="270">EncryptionManager</text>
  <rect class="node" x="900" y="312" width="190" height="48" /><text class="nodeText" x="995" y="336">DatabaseManager</text>
  <rect class="node" x="900" y="378" width="190" height="48" /><text class="nodeText" x="995" y="402">SecureAllocator</text>
  <rect class="node" x="900" y="444" width="190" height="48" /><text class="nodeText" x="995" y="468">SessionManager</text>

  <line class="edgeBiA" x1="280" y1="250" x2="500" y2="215" />
  <line class="edgeBiA" x1="280" y1="250" x2="500" y2="285" />
  <line class="edgeBiA" x1="280" y1="250" x2="500" y2="355" />
  <line class="edgeBiA" x1="280" y1="250" x2="500" y2="425" />

  <text class="edgeText" x="330" y="205">Property Bindings &amp; Signals</text>

  <line class="edge" x1="690" y1="215" x2="900" y2="204" />
  <line class="edge" x1="690" y1="285" x2="900" y2="204" />
  <line class="edge" x1="690" y1="355" x2="900" y2="204" />
  <line class="edge" x1="690" y1="425" x2="900" y2="204" />
  <line class="edge" x1="690" y1="425" x2="900" y2="468" />

  <line class="edgeBiA" x1="995" y1="228" x2="995" y2="246" />
  <line class="edgeBiA" x1="995" y1="228" x2="995" y2="312" />
  <line class="edgeDashed" x1="995" y1="294" x2="995" y2="378" />

  <text class="edgeText" x="743" y="196">Auth Commands</text>
  <text class="edgeText" x="744" y="272">CRUD Commands</text>
  <text class="edgeText" x="737" y="345">Fetch Metadata</text>
  <text class="edgeText" x="748" y="415">Lock Commands</text>
  <text class="edgeText" x="770" y="455">State</text>

  <text class="edgeText" x="1010" y="240">Payload &amp; Keys</text>
  <text class="edgeText" x="1010" y="305">Encrypted SQLite</text>
  <text class="edgeText" x="1010" y="369">Memory Locks</text>
</svg>
